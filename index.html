    :root {
      --ink: #221611;
      --cream: #fff8ea;

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

      background: var(--cream);

    a { color: inherit; }

    .wrap {

      margin: 0 auto;

      position: absolute;
      z-index: 2;
      width: 100%;
      color: var(--white);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-link {
      border-bottom: 2px solid var(--gold);
      font-size: .95rem;
      font-weight: 700;
      text-decoration: none;
    }

      max-width: 720px;
      padding-top: 72px;
    }

      letter-spacing: .18em;
      text-transform: uppercase;
